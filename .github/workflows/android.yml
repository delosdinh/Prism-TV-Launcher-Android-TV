name: Android CI

on:
  push:
    branches-ignore: [ci-results]
  pull_request:
  workflow_dispatch:

# Read-only by default. Each job below asks for only what it needs, and says why.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APKs and Play bundle
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      # Write only to (a) read the signing key from the older draft release, which GitHub shows only to
      # tokens that can write, and (b) save the build log to the ci-results branch when a build fails.
      # Once the key is in repo secrets (docs/release-signing.md), (a) goes away.
      contents: write
    env:
      # Invite codes (app/src/main/java/com/prismtv/launcher/data/Invite.kt): built into the GitHub edition.
      PRISM_INVITE_KEY: ${{ secrets.PRISM_INVITE_KEY }}
    outputs:
      signed: ${{ steps.result.outputs.signed }}
      signer: ${{ steps.result.outputs.signer }}
      vc: ${{ steps.result.outputs.vc }}
      vn: ${{ steps.result.outputs.vn }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        env:
          RELEASES_REPO: ${{ vars.RELEASES_REPO }}
        run: |
          VC=$((1000 + GITHUB_RUN_NUMBER))
          VN="0.2.${GITHUB_RUN_NUMBER}"
          echo "PRISM_VC=$VC" >> "$GITHUB_ENV"
          echo "PRISM_VN=$VN" >> "$GITHUB_ENV"
          ARGS="-PprismVersionCode=$VC -PprismVersionName=$VN"
          # Pull requests (forks can't see the key) may sign a test release with a throwaway key. Pushes,
          # which publish, never may: Gradle stops the release build instead.
          [ "$GITHUB_EVENT_NAME" = "pull_request" ] && ARGS="$ARGS -PprismAllowDebugSignedRelease=true"
          # The app checks for updates in the same releases repository CI publishes to.
          [ -n "$RELEASES_REPO" ] && ARGS="$ARGS -PprismUpdateRepo=$RELEASES_REPO"
          echo "GRADLE_VERSION_ARGS=$ARGS" >> "$GITHUB_ENV"
          echo "Version $VN ($VC)"

      # The permanent key that lets each build install over the last one (see the script for where
      # it's kept). Push builds publish, so they stop here if the key can't be found.
      - name: Signing key
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REQUIRE_KEY: ${{ github.event_name == 'push' }}
          PRISM_KEYSTORE_B64: ${{ secrets.PRISM_KEYSTORE_B64 }}
          PRISM_KEYSTORE_PASSWORD: ${{ secrets.PRISM_KEYSTORE_PASSWORD }}
        run: bash scripts/signing-key.sh

      - name: Build debug APK
        run: |
          set -o pipefail
          if ./gradlew --no-daemon --stacktrace $GRADLE_VERSION_ARGS :app:assembleGithubDebug :app:assemblePlayDebug 2>&1 | tee build-log.txt; then exit 0; fi
          # Fresh runners sometimes fail to download a dependency ("Could not find …"); try once more.
          grep -qE "Could not (find|resolve|GET|HEAD)" build-log.txt || exit 1
          echo "::warning::Dependency download failed; retrying the build once"
          sleep 20
          ./gradlew --no-daemon --stacktrace --refresh-dependencies $GRADLE_VERSION_ARGS :app:assembleGithubDebug :app:assemblePlayDebug 2>&1 | tee build-log.txt

      # The optimised GitHub-edition APK people install, and the Play edition's bundle (.aab), which is what
      # Google Play takes (docs/editions.md). If either fails (R8, signing), the whole run fails and nothing
      # is published: a debug build is never put up in its place.
      - name: Build release APK and Play bundle
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace $GRADLE_VERSION_ARGS :app:assembleGithubRelease :app:bundlePlayRelease 2>&1 | tee -a build-log.txt

      # Belt and braces: both APKs must really carry the permanent key. On a push (which publishes) a
      # mismatch fails the run; on a pull request it just means Software Update would never offer it.
      - name: Check APK signatures
        if: env.PRISM_SIGNED == 'true'
        run: |
          WANT="$(echo "$PRISM_SIGNER_SHA256" | tr -d ':' | tr 'A-F' 'a-f')"
          BAD=0
          for apk in app/build/outputs/apk/github/debug/app-github-debug.apk app/build/outputs/apk/github/release/app-github-release.apk; do
            if [ ! -f "$apk" ]; then echo "::error::$apk is missing"; BAD=1; continue; fi
            GOT="$(python3 -I scripts/apk-signer.py "$apk" || true)"
            echo "$apk → $GOT"
            if [ "$GOT" != "$WANT" ]; then
              echo "::error::$apk isn't signed with the permanent key"
              BAD=1
            fi
          done
          # The Play bundle is signed the older (jar) way: the same key, as Play App Signing needs.
          AAB=app/build/outputs/bundle/playRelease/app-play-release.aab
          if [ ! -f "$AAB" ]; then echo "::error::$AAB is missing"; BAD=1
          else
            GOT="$(keytool -printcert -jarfile "$AAB" 2>/dev/null | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')"
            echo "$AAB → $GOT"
            if [ "$GOT" != "$WANT" ]; then echo "::error::$AAB isn't signed with the permanent key"; BAD=1; fi
          fi
          if [ "$BAD" = 1 ]; then
            echo "PRISM_SIGNED=false" >> "$GITHUB_ENV"
            [ "$GITHUB_EVENT_NAME" = "push" ] && exit 1
          fi
          exit 0

      - name: Signing result
        id: result
        run: |
          echo "signed=${PRISM_SIGNED:-false}" >> "$GITHUB_OUTPUT"
          echo "signer=${PRISM_SIGNER_SHA256:-}" >> "$GITHUB_OUTPUT"
          echo "vc=$PRISM_VC" >> "$GITHUB_OUTPUT"
          echo "vn=$PRISM_VN" >> "$GITHUB_OUTPUT"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: prism-tv-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # The Play edition, to upload in Play Console (docs/play-store.md). Kept with the run only, never published.
      - name: Upload Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: prism-tv-play-bundle
          path: app/build/outputs/bundle/playRelease/*.aab
          if-no-files-found: error

      - name: Publish build log on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out
          cp build-log.txt out/ || true
          grep -E "^e: |error:|What went wrong|FAILURE" -A4 build-log.txt > out/errors.txt || true
          bash scripts/publish-ci-results.sh out "build/${GITHUB_REF_NAME}"

  # Puts the build up for download and Software Update. Its own job, on pushes only, so the one
  # job that can change releases runs none of the build tools.
  publish:
    name: Publish preview release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # to update the "preview" release
    env:
      PRISM_SIGNED: ${{ needs.build.outputs.signed }}
      PRISM_SIGNER_SHA256: ${{ needs.build.outputs.signer }}
      PRISM_VC: ${{ needs.build.outputs.vc }}
      PRISM_VN: ${{ needs.build.outputs.vn }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: prism-tv-apks
          path: apks

      # Which channels this push feeds (docs/release-signing.md, "Release channels"):
      # - preview on this repository (the test TVs): every branch, or only the branches in the repository
      #   variable PREVIEW_BRANCHES (space-separated) once it's set;
      # - the public releases-only repository (everyone else's TVs, which update from it): main only, so a
      #   work-in-progress branch never reaches them.
      - name: Choose channels
        id: channels
        env:
          PREVIEW_BRANCHES: ${{ vars.PREVIEW_BRANCHES }}
        run: |
          preview=false
          if [ -z "$PREVIEW_BRANCHES" ] || [[ " $PREVIEW_BRANCHES " == *" $GITHUB_REF_NAME "* ]]; then preview=true; fi
          stable=false
          [ "$GITHUB_REF_NAME" = "${{ github.event.repository.default_branch }}" ] && stable=true
          echo "preview=$preview" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"
          echo "::notice::${GITHUB_REF_NAME}: preview=$preview, releases repository=$stable"

      # The files both channels publish. Only the real optimised build, signed with the permanent key, is
      # ever published as prismtv.apk.
      - name: Prepare release files
        if: steps.channels.outputs.preview == 'true' || steps.channels.outputs.stable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # update-notes.sh reads the last published notes
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$PRISM_SIGNED" != "true" ] || [ ! -f apks/github/release/app-github-release.apk ]; then
            echo "::error::No release APK signed with the permanent key, so nothing was published."
            exit 1
          fi
          mkdir -p dist
          cp apks/github/release/app-github-release.apk dist/prismtv.apk
          cp apks/github/debug/app-github-debug.apk dist/prismtv-debug.apk
          # Software Update manifest (the check above means it's signed with the permanent key, so the
          # app never offers an update Android would refuse to install over it).
          NOTES="$(bash scripts/update-notes.sh)"
          python3 - "$NOTES" > dist/update.json <<'PY'
          import json, os, sys
          print(json.dumps({
            "versionCode": int(os.environ["PRISM_VC"]),
            "versionName": os.environ["PRISM_VN"],
            "commit": os.environ["GITHUB_SHA"][:7],
            "notes": sys.argv[1],
            "apk": "prismtv.apk",
            "debugApk": "prismtv-debug.apk",
            "signer": os.environ.get("PRISM_SIGNER_SHA256", ""),
          }, indent=2))
          PY
          cat dist/update.json

      # A stable direct-download link for sideloading (e.g. the Downloader app on Android TV):
      # https://github.com/<owner>/<repo>/releases/download/preview/prismtv.apk
      - name: Publish preview release
        if: steps.channels.outputs.preview == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          NOTES="Latest build of \`${GITHUB_REF_NAME}\` (${GITHUB_SHA::7}).

          Install on Android TV with Downloader: \`https://github.com/${GITHUB_REPOSITORY}/releases/download/preview/prismtv.apk\`

          - prismtv.apk: optimised build (recommended)
          - prismtv-debug.apk: debug build"
          if gh release view preview >/dev/null 2>&1; then
            gh release edit preview --prerelease --title "Preview build" --notes "$NOTES"
          else
            gh release create preview --prerelease --title "Preview build" --target "$GITHUB_SHA" --notes "$NOTES"
          fi
          gh release upload preview dist/prismtv.apk dist/prismtv-debug.apk dist/update.json --clobber

      # Every preview build also goes to the releases repository's "testing" release: TVs set to Update Channel ›
      # Testing (Settings › Software Update) read it, so test TVs keep updating themselves while the stable
      # channel ("preview" there, read by every other TV) only gets main.
      - name: Publish to the releases repository's testing channel
        if: steps.channels.outputs.preview == 'true'
        env:
          RELEASES_REPO: ${{ vars.RELEASES_REPO }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$RELEASES_REPO" ] || [ -z "$RELEASES_TOKEN" ]; then
            echo "::notice::RELEASES_REPO or RELEASES_TOKEN isn't set: no testing channel."
            exit 0
          fi
          export GH_TOKEN="$RELEASES_TOKEN" GH_REPO="$RELEASES_REPO"
          NOTES="Prism TV test build ${PRISM_VN} (\`${GITHUB_REF_NAME}\`, ${GITHUB_SHA::7}). For TVs on Update Channel › Testing; may have problems."
          if gh release view testing >/dev/null 2>&1; then
            gh release edit testing --prerelease --title "Prism TV (testing)" --notes "$NOTES"
          else
            gh release create testing --prerelease --title "Prism TV (testing)" --notes "$NOTES"
          fi
          gh release upload testing dist/prismtv.apk dist/prismtv-debug.apk dist/update.json --clobber

      # The same files on a public releases-only repository, so this code repository can be made private
      # and TVs still update without signing in (docs/editions.md). Needs the repository variable
      # RELEASES_REPO (e.g. delosdinh/Prism-TV-Launcher-Releases) and the secret RELEASES_TOKEN (a fine-grained token
      # with Contents: read and write on that repository only). Skipped until both are set, and on any
      # branch but main.
      - name: Publish to the releases-only repository
        if: steps.channels.outputs.stable == 'true'
        env:
          RELEASES_REPO: ${{ vars.RELEASES_REPO }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$RELEASES_REPO" ] || [ -z "$RELEASES_TOKEN" ]; then
            echo "::notice::RELEASES_REPO or RELEASES_TOKEN isn't set: published to this repository only."
            exit 0
          fi
          export GH_TOKEN="$RELEASES_TOKEN" GH_REPO="$RELEASES_REPO"
          NOTES="Prism TV for Android TV, version ${PRISM_VN}.

          Install with Downloader: \`https://github.com/${RELEASES_REPO}/releases/download/preview/prismtv.apk\`

          Prism TV updates itself after that (Settings › Software Update)."
          if gh release view preview >/dev/null 2>&1; then
            gh release edit preview --prerelease --title "Prism TV" --notes "$NOTES"
          else
            gh release create preview --prerelease --title "Prism TV" --notes "$NOTES"
          fi
          gh release upload preview dist/prismtv.apk dist/prismtv-debug.apk dist/update.json --clobber

  # Android Lint and the JVM unit tests, beside the build (so they add no time). Reports go to
  # ci-results under checks/<branch>/; the job fails if a unit test fails.
  checks:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write   # only to save reports to the ci-results branch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Keep Robolectric's Android jars (about 300 MB) between runs on this branch too.
          cache-read-only: false

      - name: Unit tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:testGithubDebugUnitTest 2>&1 | tee checks-log.txt

      - name: Lint
        if: always()
        continue-on-error: true
        run: |
          ./gradlew --no-daemon :app:lintGithubDebug 2>&1 | tee -a checks-log.txt

      # Unused code (private members, parameters, imports) and unreachable code, by detekt's rules. Only
      # those findings are kept: the rest of detekt's default style rules aren't this project's style.
      - name: Unused code
        if: always()
        continue-on-error: true
        run: |
          mkdir -p out
          curl -sSfL -o "$RUNNER_TEMP/detekt.jar" https://github.com/detekt/detekt/releases/download/v1.23.7/detekt-cli-1.23.7-all.jar
          java -jar "$RUNNER_TEMP/detekt.jar" --input app/src/main/java,app/src/debug/java,app/src/github/java,app/src/play/java,baselineprofile/src/main/java \
            --build-upon-default-config --config .github/detekt-unused.yml \
            --report "txt:$RUNNER_TEMP/detekt-all.txt" > "$RUNNER_TEMP/detekt-log.txt" 2>&1 || true
          grep -E "^(Unused[A-Za-z]*|UnreachableCode)\b" "$RUNNER_TEMP/detekt-all.txt" > out/detekt.txt || echo "No unused or unreachable code found" > out/detekt.txt
          grep -E "^(Analysis|Build|error)" "$RUNNER_TEMP/detekt-log.txt" >> out/detekt.txt || true

      - name: Publish reports
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out/tests
          cp app/build/reports/lint-results-debug.txt out/lint.txt 2>/dev/null || echo "no lint report" > out/lint.txt
          cp app/build/reports/lint-results-githubDebug.xml out/lint.xml 2>/dev/null || true
          cp app/build/test-results/testGithubDebugUnitTest/*.xml out/tests/ 2>/dev/null || true
          grep -E "tests completed|FAILED|BUILD (SUCCESSFUL|FAILED)|What went wrong" -A3 checks-log.txt > out/summary.txt || true
          bash scripts/publish-ci-results.sh out "checks/${GITHUB_REF_NAME}"

      # Tests that fail, or don't run at all, fail the job; lint and unused-code findings are reported only.
      - name: Fail if the unit tests didn't pass
        if: steps.tests.outcome != 'success'
        run: exit 1

  screenshots:
    name: TV emulator screenshots (API ${{ matrix.api }})
    # A run takes 40–65 min. When an emulator dies mid-run the script can wait forever (GitHub's own
    # limit is 6 hours), so stop it well before that.
    timeout-minutes: 100
    needs: build
    # 2–3 emulator hours a push. Free while the repository is public; once it's private, GitHub counts those
    # minutes against the plan's allowance, so they only run when a commit message asks with [screens].
    if: ${{ !github.event.repository.private || contains(github.event.head_commit.message, '[screens]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only to save screenshots to the ci-results branch
    strategy:
      fail-fast: false
      matrix:
        api: [34, 31, 30]
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/download-artifact@v4
        with:
          name: prism-tv-apks
          path: apks

      - name: Boot Android TV emulator and capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash scripts/ci-screenshots.sh apks/github/debug/app-github-debug.apk shots apks/github/release/app-github-release.apk apks/play/debug/app-play-debug.apk

      - name: Convert recordings to GIF
        if: always()
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          bash scripts/make-gifs.sh shots || true

      - name: Publish screenshots
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish-ci-results.sh shots "screenshots/${GITHUB_REF_NAME}/api${{ matrix.api }}"
