name: Android CI

on:
  push:
    branches-ignore: [ci-results]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee build-log.txt

      - name: Build release APK (debug-signed)
        continue-on-error: true
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: prism-tv-apks
          path: app/build/outputs/apk/**/*.apk

      # A stable direct-download link for sideloading (e.g. the Downloader app on Android TV):
      # https://github.com/<owner>/<repo>/releases/download/preview/prismtv.apk
      - name: Publish preview release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/prismtv-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/prismtv.apk
          else
            cp dist/prismtv-debug.apk dist/prismtv.apk
          fi
          NOTES="Latest build of \`${GITHUB_REF_NAME}\` (${GITHUB_SHA::7}).

          Install on Android TV with Downloader: \`https://github.com/${GITHUB_REPOSITORY}/releases/download/preview/prismtv.apk\`

          - prismtv.apk: optimised build (recommended)
          - prismtv-debug.apk: debug build"
          if gh release view preview >/dev/null 2>&1; then
            gh release edit preview --prerelease --title "Preview build" --notes "$NOTES"
          else
            gh release create preview --prerelease --title "Preview build" --target "$GITHUB_SHA" --notes "$NOTES"
          fi
          gh release upload preview dist/prismtv.apk dist/prismtv-debug.apk --clobber

      - name: Publish build log on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out
          cp build-log.txt out/ || true
          grep -E "^e: |error:|What went wrong|FAILURE" -A4 build-log.txt > out/errors.txt || true
          bash scripts/publish-ci-results.sh out "build/${GITHUB_REF_NAME}"

  screenshots:
    name: TV emulator screenshots (API ${{ matrix.api }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [31, 30]
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/download-artifact@v4
        with:
          name: prism-tv-apks
          path: apks

      - name: Boot Android TV emulator and capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash scripts/ci-screenshots.sh apks/debug/app-debug.apk shots apks/release/app-release.apk

      - name: Convert recordings to GIF
        if: always()
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          bash scripts/make-gifs.sh shots || true

      - name: Publish screenshots
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish-ci-results.sh shots "screenshots/${GITHUB_REF_NAME}/api${{ matrix.api }}"
