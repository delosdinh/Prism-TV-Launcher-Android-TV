name: Startup profile

# Records Prism TV's startup (baseline) profile on the Android TV emulator. It only runs for a push
# whose commit message contains [profile]; the result is uploaded as the "startup-profile" artifact, to
# be committed under app/src/release/generated/baselineProfiles/.
on:
  push:
    branches-ignore: [ci-results]

permissions:
  contents: read

concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Record the startup profile (API 34)
    if: contains(github.event.head_commit.message, '[profile]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Built before the emulator starts, so it isn't kept waiting.
      - name: Build Prism TV and the recorder
        continue-on-error: true
        run: ./gradlew --no-daemon --stacktrace :app:assembleNonMinifiedRelease :baselineprofile:assembleNonMinifiedRelease

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Record on the Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: ./gradlew --no-daemon --stacktrace :app:generateBaselineProfile -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=BaselineProfile -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR

      - name: Upload the profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-profile
          path: |
            app/src/*/generated/baselineProfiles/
            baselineprofile/build/outputs/
          if-no-files-found: warn
