[versions]
agp = "8.9.1"
kotlin = "2.1.20"
composeBom = "2025.02.00"
activityCompose = "1.10.1"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
coroutines = "1.10.1"
media3 = "1.5.1"
